name: Actualizar Punteirolos 9.0

on:
  schedule:
    - cron: '0 10 * * 1'  # Lunes 10:00 UTC (11h España invierno, 12h verano)
  workflow_dispatch:       # Permite ejecutarlo manualmente

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Descargar repositorio
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📡 Generar estadísticas
        run: python generate_9.py

      - name: 🚀 Publicar en GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
          exclude_assets: '.github,generate_9.py,template.html,README.md,splash.png'
