name: Actualizar Punteirolos 9.0

on:
  schedule:
    - cron: '0 10 * * 2'   # martes 10:00 UTC
    - cron: '0 6 * * 6'    # sábado a primera hora: 06:00 UTC (07:00 en España en invierno, 08:00 en verano)
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generar estadisticas
        run: python generate_9.py

      - name: Publicar en GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
          exclude_assets: '.github,generate_9.py,README_9.md'
