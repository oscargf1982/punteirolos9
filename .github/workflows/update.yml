name: Actualizar Punteirolos 9.0

on:
  schedule:
    - cron: '0 10 * * 2'            # martes 10:00 UTC
    - cron: '0 */4 * * 1'           # lunes, cada 4 horas
    - cron: '*/15 12-19 * * 5,6,0'  # viernes, sábado y domingo: de 12:00 a 19:45 UTC (13:00 a 20:45 en España en invierno), cada 15 min
    - cron: '0 20 * * 5,6,0'        # ... y la última a las 20:00 UTC (21:00 en España en invierno)
  workflow_dispatch:

# Evita que dos ejecuciones publiquen a la vez
concurrency:
  group: punteirolos-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generar estadisticas
        run: python generate_9.py

      - name: Publicar en GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
          exclude_assets: '.github,generate_9.py,README_9.md'
